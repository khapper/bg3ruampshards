<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Каталог осколков — Arcanizer</title>
<style>
:root{
  --vault:#141219; --vault2:#1B1922; --vault3:#23202C; --vault4:#2C2836;
  --edge:#38333F; --edge-soft:#2A2632;
  --brass:#B99757; --brass-dim:#7A6539;
  --text:#E6E0D4; --text2:#B5AD9E; --muted:#8B8378;

  --leg:#E08A3C; --vrare:#A96FD8; --rare:#4E9BE0; --unc:#52B788; --com:#948B7E;

  --fire:#E8703A; --cold:#6FB7E8; --lightning:#E6C245; --thunder:#A78BE8;
  --acid:#93C64B; --poison:#5FAF6E; --necro:#7D9471; --radiant:#F0D98A;
  --psychic:#E27AB4; --force:#B3C0E8; --phys:#BDB4A6;
  --danger:#D9584B;

  --serif:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,'Times New Roman',serif;
  --sans:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --mono:ui-monospace,'SF Mono','Cascadia Code','Roboto Mono',Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--vault);
  color:var(--text);
  font-family:var(--sans);
  font-size:15px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px;border-radius:3px}

/* ── шапка ─────────────────────────────────────────── */
.top{
  border-bottom:1px solid var(--edge);
  background:linear-gradient(180deg,#1D1A24 0%,#161420 100%);
  padding:20px 24px 0;
  position:sticky;top:0;z-index:40;
}
.top-row{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-end;justify-content:space-between;max-width:1600px;margin:0 auto}
.brand h1{
  font-family:var(--serif);font-weight:400;font-size:30px;line-height:1.1;
  margin:0;letter-spacing:.01em;color:var(--text);
}
.brand p{margin:6px 0 0;color:var(--muted);font-size:13.5px;max-width:60ch}
.searchwrap{position:relative;flex:1 1 320px;max-width:440px}
.searchwrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);opacity:.5;pointer-events:none}
#q{
  width:100%;padding:11px 34px 11px 36px;
  background:var(--vault);border:1px solid var(--edge);border-radius:4px;
  color:var(--text);
}
#q::placeholder{color:var(--muted)}
#q:focus{border-color:var(--brass-dim);outline:none;box-shadow:0 0 0 3px rgba(185,151,87,.13)}
.clearq{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--muted);cursor:pointer;padding:6px;line-height:0;display:none}
.clearq.on{display:block}

/* пресеты */
.presets{display:flex;gap:7px;overflow-x:auto;padding:14px 0 13px;max-width:1600px;margin:0 auto;scrollbar-width:thin}
.preset{
  flex:0 0 auto;background:var(--vault3);border:1px solid var(--edge);
  border-radius:999px;padding:6px 14px;font-size:13px;color:var(--text2);cursor:pointer;
  transition:none;
}
.preset:hover{border-color:var(--brass-dim);color:var(--text)}
.preset[aria-pressed="true"]{background:var(--brass);border-color:var(--brass);color:#191510;font-weight:600}

/* ── каркас ────────────────────────────────────────── */
.shell{display:flex;gap:0;max-width:1600px;margin:0 auto;align-items:flex-start}
.rail{
  flex:0 0 236px;border-right:1px solid var(--edge);
  padding:18px 18px 60px;position:sticky;top:var(--topH,158px);
  max-height:calc(100vh - var(--topH,158px));overflow-y:auto;scrollbar-width:thin;
}
.main{flex:1 1 auto;min-width:0;padding:16px 24px 80px}

.fgroup{margin-bottom:22px}
.fgroup > h3{
  font-family:var(--serif);font-size:14px;font-weight:400;margin:0 0 9px;
  color:var(--brass);letter-spacing:.02em;
}
.opt{display:flex;align-items:center;gap:8px;padding:3.5px 0;cursor:pointer;font-size:13.5px;color:var(--text2)}
.opt:hover{color:var(--text)}
.opt input{
  appearance:none;width:14px;height:14px;flex:0 0 14px;
  border:1px solid var(--edge);border-radius:2px;background:var(--vault);cursor:pointer;position:relative;
}
.opt input:checked{background:var(--brass);border-color:var(--brass)}
.opt input:checked::after{
  content:'';position:absolute;left:4px;top:1px;width:4px;height:8px;
  border:solid #191510;border-width:0 2px 2px 0;transform:rotate(42deg);
}
.opt .cnt{margin-left:auto;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.opt input:checked ~ .lbl{color:var(--text)}

/* ── тулбар ────────────────────────────────────────── */
.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:16px}
.count{font-size:13.5px;color:var(--muted)}
.count b{color:var(--text);font-weight:600;font-variant-numeric:tabular-nums}
.bar-right{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
select#sort{
  background:var(--vault3);border:1px solid var(--edge);border-radius:4px;
  padding:7px 10px;font-size:13.5px;cursor:pointer;
}
.seg{display:flex;border:1px solid var(--edge);border-radius:4px;overflow:hidden}
.seg button{background:var(--vault3);border:0;padding:7px 13px;font-size:13.5px;color:var(--text2);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--brass);color:#191510;font-weight:600}
.linkbtn{background:none;border:0;color:var(--brass);cursor:pointer;font-size:13px;padding:4px 2px;text-decoration:underline;text-underline-offset:3px}

/* ── карточки ──────────────────────────────────────── */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.card{
  background:var(--vault2);border:1px solid var(--edge-soft);border-radius:5px;
  padding:13px 14px 12px 17px;position:relative;overflow:hidden;
}
.card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--rail-c,var(--edge))}
.card.fav{border-color:var(--brass-dim)}
.chead{display:flex;gap:10px;align-items:flex-start;margin-bottom:7px}
.cname{font-family:var(--serif);font-size:16.5px;line-height:1.25;flex:1;min-width:0}
.cname .pre{color:var(--muted);font-size:12.5px;display:block;letter-spacing:.02em}
.star{background:none;border:0;cursor:pointer;color:var(--edge);padding:2px;line-height:0;flex:0 0 auto}
.star:hover{color:var(--brass-dim)}
.star.on{color:var(--brass)}

.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:9px;font-size:12px}
.rar{display:inline-flex;align-items:center;gap:6px;color:var(--rar-c)}
.gem{width:8px;height:8px;background:var(--rar-c);transform:rotate(45deg);flex:0 0 8px}
.slot{color:var(--muted)}
.price{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--text2);font-variant-numeric:tabular-nums}

.payload{
  display:flex;flex-wrap:wrap;gap:5px 14px;align-items:baseline;
  background:var(--vault3);border-radius:4px;padding:8px 10px;margin-bottom:9px;
}
.dice{font-family:var(--mono);font-size:16px;font-weight:600;color:var(--d-c,var(--text))}
.dlabel{font-size:11.5px;color:var(--muted);margin-left:-9px}
.avg{font-family:var(--mono);font-size:12.5px;color:var(--text2);font-variant-numeric:tabular-nums}
.recoil{color:var(--danger);flex:0 0 100%}
.pill{
  font-size:11.5px;padding:2px 8px;border-radius:999px;
  background:var(--vault4);color:var(--text2);border:1px solid var(--edge);
}

.where{font-size:11.5px;color:var(--muted);margin:-4px 0 8px}
.desc{font-size:13.5px;line-height:1.52;color:var(--text2);margin:0 0 10px}
.tags{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.tag{font-size:11.5px;padding:2px 8px;border-radius:3px;background:var(--vault3);color:var(--muted);border:1px solid transparent;cursor:pointer}
.tag:hover{border-color:var(--brass-dim);color:var(--text2)}
.tag.dmg{color:var(--brass);background:rgba(185,151,87,.09)}
.flag{font-size:11.5px;padding:2px 8px;border-radius:3px;color:var(--muted);border:1px dashed var(--edge)}
.cmd{
  margin-top:10px;padding-top:9px;border-top:1px solid var(--edge-soft);
  display:flex;gap:8px;align-items:flex-start;
}
.cmd code{
  flex:1;min-width:0;font-family:var(--mono);font-size:10px;line-height:1.5;
  color:#736C62;word-break:break-all;user-select:all;
}
.cmd code::selection{background:var(--brass);color:#191510}
.cmd button{
  flex:0 0 auto;background:none;border:1px solid var(--edge);border-radius:3px;
  color:var(--muted);cursor:pointer;font-size:11px;padding:3px 8px;font-family:var(--sans);white-space:nowrap;
}
.cmd button:hover{color:var(--text);border-color:var(--brass-dim)}
.tcopy{background:none;border:1px solid var(--edge);border-radius:3px;color:var(--muted);cursor:pointer;font-size:11px;padding:3px 8px;white-space:nowrap}
.tcopy:hover{color:var(--text);border-color:var(--brass-dim)}

/* ── таблица ───────────────────────────────────────── */
.tablewrap{overflow-x:auto;border:1px solid var(--edge-soft);border-radius:5px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{
  text-align:left;padding:9px 12px;background:var(--vault3);color:var(--text2);
  font-weight:600;font-size:12.5px;white-space:nowrap;border-bottom:1px solid var(--edge);
  cursor:pointer;
}
th:hover{color:var(--brass)}
th .arw{color:var(--brass);font-size:10px}
td{padding:8px 12px;border-bottom:1px solid var(--edge-soft);vertical-align:top}
tbody tr:hover{background:var(--vault2)}
td.num{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td.nm{font-family:var(--serif);font-size:14.5px}
.tstar{background:none;border:0;cursor:pointer;color:var(--edge);padding:0;line-height:0}
.tstar.on{color:var(--brass)}

.legend{margin-top:26px;padding-top:14px;border-top:1px solid var(--edge-soft);color:var(--muted);font-size:12.5px;max-width:78ch;line-height:1.6}
.empty{text-align:center;padding:70px 20px;color:var(--muted)}
.empty p{font-family:var(--serif);font-size:19px;color:var(--text2);margin:0 0 6px}

/* мобильные */
.railtoggle{display:none}
@media (max-width:900px){
  .top{padding:16px 16px 0;position:static}
  .brand h1{font-size:24px}
  .shell{display:block}
  .rail{
    position:static;max-height:none;border-right:0;border-bottom:1px solid var(--edge);
    padding:16px;display:none;
  }
  .rail.open{display:block}
  .railtoggle{
    display:block;width:100%;margin:14px 0 0;padding:10px;
    background:var(--vault3);border:1px solid var(--edge);border-radius:4px;color:var(--text);cursor:pointer;
  }
  .main{padding:16px}
  .grid{grid-template-columns:1fr}
  th{position:static}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header class="top">
  <div class="top-row">
    <div class="brand">
      <h1>Каталог рунических осколков</h1>
    </div>
    <div class="searchwrap">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="осколок бездны, реверберация, 2d6…" autocomplete="off" aria-label="Поиск по осколкам">
      <button class="clearq" id="clearq" aria-label="Очистить поиск">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
  </div>
  <div class="presets" id="presets"></div>
</header>

<div class="shell">

  <aside class="rail" id="rail"></aside>
  <main class="main">
    <div class="bar">
      <div class="count" id="count"></div>
      <div class="bar-right">
        <select id="sort" aria-label="Сортировка"></select>
        <div class="seg" role="group" aria-label="Вид">
          <button id="vcards" aria-pressed="true">Карточки</button>
          <button id="vtable" aria-pressed="false">Таблица</button>
        </div>
      </div>
    </div>
    <div id="out"></div>
    <p class="legend">≈ — среднее значение броска. У условного урона («по промокшим», «нежити», «пока ОЗ ниже 50%») это потолок, а не средний урон за бой. «Итого» вычитает отдачу. Цена — стоимость у торговца. Команда рассчитана на консоль Script Extender и выдаёт осколок главному персонажу.</p>
  </main>
</div>

let FAV = new Set(), memFav = null;
async function loadFav(){
  try{ const r = await window.storage.get('bg3_shard_favs'); if(r && r.value) FAV = new Set(JSON.parse(r.value)); }
  catch(_){ if(memFav) FAV = new Set(memFav); }
}
async function saveFav(){
  memFav = [...FAV];
  try{ await window.storage.set('bg3_shard_favs', JSON.stringify(memFav)); }catch(_){}
}

  const m = new Map();

/* ── отрисовка боковой панели ───────────────────────── */
function optRow(group,val,label,count){
  const on = S[group].has(val);
  return `<label class="opt"><input type="checkbox" data-g="${group}" data-v="${esc(val)}" ${on?'checked':''}><span class="lbl">${esc(label)}</span><span class="cnt">${count}</span></label>`;
}
function buildRail(){
  const tagList = [...CNT_TAG.entries()].sort((a,b)=>b[1]-a[1]);
  const typeList = [...CNT_TYPE.entries()].sort((a,b)=>b[1]-a[1]);
  const flagList = [...CNT_FLAG.entries()].sort((a,b)=>b[1]-a[1]);
  rail.innerHTML =
   `<div class="fgroup"><h3>Слот</h3>${CAT_ORDER.filter(c=>CNT_CAT.has(c)).map(c=>optRow('cats',c,CAT_RU[c]||c,CNT_CAT.get(c))).join('')}</div>
    <div class="fgroup"><h3>Редкость</h3>${RAR_ORDER.filter(r=>CNT_RAR.has(r)).map(r=>optRow('rars',r,r,CNT_RAR.get(r))).join('')}</div>
    <div class="fgroup"><h3>Что делает</h3>${tagList.map(([t,c])=>optRow('tags',t,t,c)).join('')}</div>
    <div class="fgroup"><h3>Тип урона</h3>${typeList.map(([t,c])=>optRow('types',t,t,c)).join('')}</div>
    <div class="fgroup"><h3>Особенности</h3>${flagList.map(([t,c])=>optRow('flags',t,t,c)).join('')}</div>`;
}
function syncRail(){

}

/* ── фильтрация ─────────────────────────────────────── */
function passes(it){
  if(S.favOnly && !FAV.has(it.u)) return false;
  if(S.cats.size && !S.cats.has(it.c)) return false;
  if(S.rars.size && !S.rars.has(it.r)) return false;
  if(S.tags.size && !it.g.some(t=>S.tags.has(t))) return false;
  if(S.types.size && !it.t.some(t=>S.types.has(t))) return false;
  if(S.flags.size && !it.f.some(t=>S.flags.has(t))) return false;
  if(S.q){
    const q = S.q.toLowerCase();
    const hay = (it.n+' '+it.e+' '+it.u+' '+it.da+' '+it.sd+' '+it.g.join(' ')+' '+it.t.join(' ')).toLowerCase();
    if(!hay.includes(q)) return false;
  }
  return true;
}
function sortItems(a){
  const by = {
    rar:(x,y)=> y.rr-x.rr || CAT_ORDER.indexOf(x.c)-CAT_ORDER.indexOf(y.c) || x.n.localeCompare(y.n,'ru'),
    net:(x,y)=> y.an-x.an || y.aa-x.aa || y.rr-x.rr || x.n.localeCompare(y.n,'ru'),
    add:(x,y)=> y.aa-x.aa || y.rr-x.rr || x.n.localeCompare(y.n,'ru'),
    setdie:(x,y)=> y.sa-x.sa || y.an-x.an || x.n.localeCompare(y.n,'ru'),
    price_desc:(x,y)=> y.p-x.p || x.n.localeCompare(y.n,'ru'),
    price_asc:(x,y)=> x.p-y.p || x.n.localeCompare(y.n,'ru'),
    name:(x,y)=> x.n.localeCompare(y.n,'ru'),
    slot:(x,y)=> CAT_ORDER.indexOf(x.c)-CAT_ORDER.indexOf(y.c) || y.rr-x.rr || x.n.localeCompare(y.n,'ru'),
  }[S.sort];
  return a.sort(by);
}

/* ── помощники ──────────────────────────────────────── */
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function splitName(n){
  const m = n.match(/^(Рунический осколок)\s+(.+)$/i);
  if(m) return {pre:m[1], main:m[2]};
  return {pre:'', main:n};
}
function mainType(it){
  if(it.da){ const first = it.t.find(t=>it.da.includes(t.toLowerCase())); if(first) return first; }
  return it.t[0]||null;
}
function num(v){ return Number.isInteger(v)?v:v.toFixed(1); }

/* ── карточки ───────────────────────────────────────── */
function cardHTML(it){
  const nm = splitName(it.n);
  const mt = mainType(it);
  const rail_c = (it.aa>0||it.sd) && mt ? (DMG_C[mt]||'var(--edge)') : (RAR_C[it.r]||'var(--edge)');
  const fav = FAV.has(it.u);

  let payload = '';
  const bits = [];
  if(it.da){
    const parts = it.da.split(' + ');
    const dd = parts.map(s=>s.replace(/ .+$/,'')).join(' + ');
    const tt = [...new Set(parts.map(s=>s.replace(/^\S+ /,'')))].join(' + ');
    bits.push(`<span class="dice" style="--d-c:${DMG_C[mt]||'var(--text)'}">+${esc(dd)}</span><span class="dlabel">${esc(tt)}</span><span class="avg" title="Среднее за бросок. Если урон условный — это потолок.">≈${num(it.aa)}</span>`);
  }
  if(it.sd) bits.push(`<span class="dice">${esc(it.sd)}</span><span class="dlabel">кубик оружия${mt?' → '+esc(mt.toLowerCase()):''}</span><span class="avg">≈${num(it.sa)}</span>`);
  if(it.ds) bits.push(`<span class="avg recoil">−${esc(it.ds)} отдачей (≈${num(it.av)})</span>`);
  if(it.h) bits.push(`<span class="avg" style="color:var(--unc)">+${it.h} ОЗ</span>`);
  if(!bits.length && it.b!=null) bits.push(`<span class="dice">+${it.b}</span><span class="dlabel">бонус</span>`);
  if(it.ch!=null) bits.push(`<span class="pill">${it.ch}% шанс</span>`);
  if(bits.length) payload = `<div class="payload">${bits.join('')}</div>`;

  return `<article class="card${fav?' fav':''}" style="--rail-c:${rail_c}">
    <div class="chead">
      <div class="cname">${nm.pre?`<span class="pre">${esc(nm.pre)}</span>`:''}${esc(nm.main)}</div>
      <button class="star${fav?' on':''}" data-fav="${esc(it.u)}" aria-label="В избранное" aria-pressed="${fav}">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="${fav?'currentColor':'none'}" stroke="currentColor" stroke-width="1.6"><path d="M12 3l2.6 5.6 6 .8-4.4 4.2 1.1 6.1L12 16.9 6.7 19.7l1.1-6.1L3.4 9.4l6-.8z"/></svg>
      </button>
    </div>
    <div class="meta">
      <span class="rar" style="--rar-c:${RAR_C[it.r]}"><i class="gem"></i>${esc(it.r)}</span>
      <span class="slot">· ${esc(it.s)}</span>
      <span class="price">${it.p} зол.</span>
    </div>
    ${whereLine(it)}
    ${payload}
    <p class="desc">${esc(cap(it.e))}</p>
    <div class="tags">
      ${it.g.map(t=>`<span class="tag${t==='Прямой урон'||t==='Замена кубика оружия'?' dmg':''}" data-tag="${esc(t)}" role="button" tabindex="0">${esc(t)}</span>`).join('')}
      ${it.f.filter(f=>f!=='Условный').map(f=>`<span class="flag">${esc(f)}</span>`).join('')}
    </div>
    <div class="cmd"><code>${esc(CMD(it.u))}</code><button data-copy="${esc(CMD(it.u))}">копировать</button></div>
  </article>`;
}
function whereLine(it){
  const t = TARGETS[it.tg] || '';
  if(t.includes('основной руке')) return '<div class="where">основная рука; если ближнего оружия нет — дальнобойное</div>';
  if(t.includes('верхнем слоте')) return '<div class="where">кольцо в верхнем слоте</div>';
  if(t.includes('извлечь'))       return '<div class="where">вынимает все осколки из надетой экипировки</div>';
  return '';
}
function cap(s){ return s ? s[0].toUpperCase()+s.slice(1) : s; }

/* ── таблица ────────────────────────────────────────── */
const COLS = [
  ['','', ''],
  ['name','Название','nm'],
  ['slot','Слот',''],
  ['rar','Редкость',''],
  ['add','Урон','num'],
  ['setdie','Кубик','num'],
  ['net','Итого','num'],
  ['price_desc','Цена','num'],
  ['','Команда',''],
];
function tableHTML(list){
  const head = COLS.map(([k,l,c])=>{
    const act = (k===S.sort)||(k==='price_desc'&&S.sort==='price_asc');
    return `<th data-sort="${k}">${l}${act?' <span class="arw">▼</span>':''}</th>`;
  }).join('');
  const rows = list.map(it=>{
    const nm = splitName(it.n), fav = FAV.has(it.u), mt = mainType(it);
    return `<tr>
      <td><button class="tstar${fav?' on':''}" data-fav="${esc(it.u)}" aria-label="В избранное"><svg width="14" height="14" viewBox="0 0 24 24" fill="${fav?'currentColor':'none'}" stroke="currentColor" stroke-width="1.7"><path d="M12 3l2.6 5.6 6 .8-4.4 4.2 1.1 6.1L12 16.9 6.7 19.7l1.1-6.1L3.4 9.4l6-.8z"/></svg></button></td>
      <td class="nm">${esc(nm.main)}
        <div style="font-size:12px;color:var(--muted);font-family:var(--sans);max-width:52ch;line-height:1.4">${esc(cap(it.e).slice(0,120))}${it.e.length>120?'…':''}</div></td>
      <td style="color:var(--text2);white-space:nowrap">${esc(it.s)}</td>
      <td style="color:${RAR_C[it.r]};white-space:nowrap">${esc(it.r)}</td>
      <td class="num" style="color:${it.da?(DMG_C[mt]||'var(--text)'):'var(--muted)'}">${it.da?'+'+esc(it.da.replace(/ [а-яё]+/g,'')):'—'}</td>
      <td class="num">${it.sd?esc(it.sd):'—'}</td>
      <td class="num" style="color:${it.an>0?'var(--text)':'var(--muted)'}">${it.an?num(it.an):(it.sa?num(it.sa):'—')}</td>
      <td class="num" style="color:var(--text2)">${it.p}</td>
      <td><button class="tcopy" data-copy="${esc(CMD(it.u))}">копировать</button></td>
    </tr>`;
  }).join('');
  return `<div class="tablewrap"><table><thead><tr>${head}</tr></thead><tbody>${rows}</tbody></table></div>`;
}

/* ── главный рендер ─────────────────────────────────── */
function render(){
  const list = sortItems(ITEMS.filter(passes));
  const total = ITEMS.length;
  const filtered = list.length!==total;
  count.innerHTML = `<b>${list.length}</b> из ${total}` + (filtered?` <button class="linkbtn" id="reset">сбросить</button>`:'');

  if(!list.length){
    out.innerHTML = `<div class="empty"><p>Ничего не нашлось</p><span>Сними часть фильтров или очисти поиск — условия сложились так, что подходящих осколков нет.</span></div>`;
  } else {
    out.innerHTML = S.view==='cards' ? `<div class="grid">${list.map(cardHTML).join('')}</div>` : tableHTML(list);
  }
  syncRail();
  renderPresets();
  syncSticky();
  sortSel.value = S.sort;
  vcards.setAttribute('aria-pressed', S.view==='cards');
  vtable.setAttribute('aria-pressed', S.view==='table');
}
function renderPresets(){
  presets.innerHTML = PRESETS.map(p=>`<button class="preset" data-p="${p.id}" aria-pressed="${S.preset===p.id}">${p.label}</button>`).join('');
}

/* ── события ────────────────────────────────────────── */
const CMD = u => 'Osi.TemplateAddTo("'+u+'", Osi.GetHostCharacter(), 1)';

function copyText(s, done){
  // синхронный путь: единственный, что стабильно работает внутри iframe
  let ok = false;
  try{
    const ta = document.createElement('textarea');
    ta.value = s; ta.setAttribute('readonly','');
    ta.style.cssText = 'position:fixed;top:0;left:0;width:2px;height:2px;padding:0;border:0;opacity:0;';
    document.body.appendChild(ta);
    ta.focus(); ta.select(); ta.setSelectionRange(0, s.length);
    ok = document.execCommand('copy');
    document.body.removeChild(ta);
  }catch(_){ ok = false; }
  if(ok){ done(true); return; }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(s).then(()=>done(true), ()=>done(false));
    return;
  }
  done(false);
}
function selectNode(el){
  try{
    const r = document.createRange(); r.selectNodeContents(el);
    const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
  }catch(_){}
}
const $ = id => document.getElementById(id);
const rail=$('rail'), out=$('out'), count=$('count'), presets=$('presets'),
      sortSel=$('sort'), vcards=$('vcards'), vtable=$('vtable'), qbox=$('q');

sortSel.innerHTML = SORTS.map(([v,l])=>`<option value="${v}">${l}</option>`).join('');

let t=null;
qbox.addEventListener('input', ()=>{
  clearTimeout(t);
  $('clearq').classList.toggle('on', !!qbox.value);
  t=setTimeout(()=>{S.q=qbox.value.trim(); render();},140);
});
$('clearq').addEventListener('click',()=>{qbox.value='';S.q='';$('clearq').classList.remove('on');render();qbox.focus()});

document.addEventListener('change', e=>{
  const g = e.target.dataset && e.target.dataset.g;
  if(g){ const v=e.target.dataset.v; e.target.checked?S[g].add(v):S[g].delete(v); S.preset=null; render(); return; }
});

document.addEventListener('click', async e=>{
  const p = e.target.closest('[data-p]');
  if(p){
    S.cats.clear(); S.rars.clear(); S.tags.clear(); S.types.clear(); S.flags.clear();
    S.favOnly=false; S.sort='rar'; S.preset=p.dataset.p;
    PRESETS.find(x=>x.id===p.dataset.p).apply(); render(); return;
  }
  const f = e.target.closest('[data-fav]');
  if(f){ const u=f.dataset.fav; FAV.has(u)?FAV.delete(u):FAV.add(u); await saveFav(); render(); return; }
  const c = e.target.closest('[data-copy]');
  if(c){
    const o = c.dataset.label || c.textContent;
    c.dataset.label = o;
    copyText(c.dataset.copy, ok=>{
      if(ok){ c.textContent='скопировано'; }
      else {
        const box = c.parentElement.querySelector('code');
        if(box){ selectNode(box); c.textContent='выделено, Ctrl+C'; }
        else { c.textContent='не вышло'; }
      }
      setTimeout(()=>{c.textContent=o;}, 1800);
    });
    return;
  }
  const tg = e.target.closest('[data-tag]');
  if(tg){ S.tags=new Set([tg.dataset.tag]); S.preset=null; render(); window.scrollTo({top:0,behavior:'smooth'}); return; }
  const th = e.target.closest('[data-sort]');
  if(th && th.dataset.sort){
    const k=th.dataset.sort;
    S.sort = (k==='price_desc'&&S.sort==='price_desc') ? 'price_asc' : k;
    render(); return;
  }
  if(e.target.id==='reset'){
    S.cats.clear();S.rars.clear();S.tags.clear();S.types.clear();S.flags.clear();
    S.favOnly=false;S.q='';qbox.value='';$('clearq').classList.remove('on');S.preset='all';render();return;
  }
});
document.addEventListener('keydown', e=>{
  if(e.key==='Enter' && e.target.classList && e.target.classList.contains('tag')) e.target.click();
});
sortSel.onchange=()=>{S.sort=sortSel.value;render()};
vcards.onclick=()=>{S.view='cards';render()};
vtable.onclick=()=>{S.view='table';render()};
$('railtoggle').onclick=function(){
  const open = rail.classList.toggle('open');
  this.setAttribute('aria-expanded', open);
  this.textContent = open ? 'Скрыть фильтры' : 'Фильтры';
};

window.addEventListener('resize', syncSticky);
buildRail();
loadFav().then(render);
</script>
</body>
</html>
